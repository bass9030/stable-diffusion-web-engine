# Plan B: SD 1.5 UNet full fine-tuning (클라우드 GPU, A100/L4 기준). train_lora.yaml 위에 덮어쓴다.
#   python -m src.train.train_full --config configs/base.yaml configs/train_lora.yaml configs/train_full.yaml
# T4(16GB)는 뒤에 configs/train_full_t4.yaml 을 더 붙인다.
model:
  # LoRA overfit v6~v8에서 전역 색/레이아웃 학습에 효과가 있었던 설정 (full FT는 v-pred 전환 용량이 충분할 것으로 기대, 미검증)
  prediction_type: v_prediction
  zero_terminal_snr: true
  unet_dtype: float32

train:
  run_name: full_short
  max_steps: 6000
  batch_size: 8
  grad_accum: 1
  # full fine-tuning은 LoRA보다 훨씬 작은 학습률을 쓴다 (diffusers text-to-image 예제 기본값 1e-5 수준)
  learning_rate: 1.0e-5
  lr_scheduler: constant_with_warmup
  lr_warmup_steps: 500
  weight_decay: 1.0e-2
  # bfloat16 | float16 | no. bf16은 Ampere(A100/L4) 이상, T4는 float16
  mixed_precision: bfloat16
  use_8bit_adam: false
  noise_offset: 0.0
  high_timestep_prob: 0.5
  caption_dropout: 0.1
  gradient_checkpointing: true
  log_every: 20
  sample_every: 500
  checkpoint_every: 1000
  # 체크포인트 저장 dtype (UNet 1개 fp16 약 1.7GB). 최근 N개만 남긴다 (Drive 용량 절약)
  checkpoint_dtype: float16
  keep_last_checkpoints: 2

sample:
  batch_size: 6
  guidance_scale: 3.0
  guidance_rescale: 0.7
