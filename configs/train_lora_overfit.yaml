# 파이프라인 점검용 overfit 테스트 (CLAUDE.md: 본 학습 전 수십 장으로 확인).
# train_lora.yaml 위에 덮어쓴다. 학습 샘플이 정답과 거의 같아지면 파이프라인 정상.
#   python -m src.train.train_lora --config configs/base.yaml configs/train_lora.yaml configs/train_lora_overfit.yaml
lora:
  rank: 64
  alpha: 64

data:
  max_train_samples: 32
  num_sample_val: 2
  num_sample_train: 4

train:
  run_name: lora_overfit_v5
  max_steps: 3000
  learning_rate: 5.0e-4
  grad_accum: 1
  lr_warmup_steps: 20
  caption_dropout: 0.0
  sample_every: 500
  checkpoint_every: 3000

sample:
  guidance_scale: 1.0
